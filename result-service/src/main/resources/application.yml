spring:
  application:
    name: result-service
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# Cấu hình timeout cho Feign client (gọi Speech/Pronunciation/AI Service)
spring.cloud.openfeign.client.config:
  default:
    connect-timeout: 5000
    read-timeout: 60000

