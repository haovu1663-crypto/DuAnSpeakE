spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Route tới pronunciation-service
        - id: pronunciation-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/pronunciation/**
          filters:
            - StripPrefix=1

        # Route tới speech-service
        - id: speech-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/speech/**
          filters:
            - StripPrefix=1

        # Route tới ai-analysis-service
        - id: ai-analysis-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/ai-analysis/**
          filters:
            - StripPrefix=1

        # Route tới result-service
        - id: result-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/result/**
          filters:
            - StripPrefix=1

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG
