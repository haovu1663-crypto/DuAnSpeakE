spring:
  application:
    name: eureka-server

server:
  port: 8761

eureka:
  instance:
    hostname: localhost
  client:
    # Eureka server không tự đăng ký vào chính nó
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Tắt bảo vệ self-preservation trong môi trường dev
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000
